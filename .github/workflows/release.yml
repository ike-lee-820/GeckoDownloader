name: Release arm64-v8a APK

# 自动发版：push 到 main（默认分支）就构建 arm64-v8a release APK 并发布 GitHub Release。
# 同一次提交的重跑不会重复发版；版本号按 YY.MM.N 自动迭代，无需手动打 tag。
# 另外保留 release* 分支/tag 与 Actions 手动运行作为补充入口。
on:
  push:
    branches:
      - 'main'
      - 'release*'
      - 'release/**'
    tags:
      - 'release*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，留空则按 YY.MM.N 自动迭代（例如 26.11.0）'
        required: false
        type: string
        default: ''
      geckoview_version:
        description: 'GeckoView 版本，留空用已验证的 120.0.20231113165053'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version (YY.MM.N)
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 年.月 按北京时间取两位年份与月份，例如 2026-11 -> 26.11
          PREFIX=$(TZ='Asia/Shanghai' date +%y.%m)
          REF_TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${REF_TAG}" =~ ([0-9]{2}\.[0-9]{1,2}\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            # 当月已有 tag 的最大序号 +1；没有则本月从 0 开始（26.11.0）
            MAX_N=-1
            while IFS= read -r t; do
              n="${t##*.}"
              if [[ "${n}" =~ ^[0-9]+$ ]] && (( 10#$n > MAX_N )); then
                MAX_N=$((10#$n))
              fi
            done < <(git tag -l "${PREFIX}.*")
            VERSION="${PREFIX}.$((MAX_N + 1))"
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::非法版本号 ${VERSION}，应为 YY.MM.N，例如 26.11.0"
            exit 1
          fi
          # Rerunning the same commit must not fail: just skip publishing later.
          ALREADY=false
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            ALREADY=true
            echo "Tag ${VERSION} 已存在，本次仅重新校验构建，不再重复发布"
          fi

          YY=${VERSION%%.*}
          REST=${VERSION#*.}
          MM=${REST%%.*}
          N=${REST##*.}
          # 26.11.0 -> 2611000，保证 versionCode 随版本单调递增
          VC=$(( 10#$YY * 100000 + 10#$MM * 1000 + 10#$N ))

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VC}" >> "$GITHUB_OUTPUT"
          echo "already_published=${ALREADY}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (versionCode ${VC}), already_published=${ALREADY}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships an Android SDK; no third-party setup action needed
      # (it failed on the very first run, and downloading cmdline-tools is unreliable).
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: ${SDK_ROOT}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [[ -z "${SDKMGR}" ]]; then
            SDKMGR="$(find "${SDK_ROOT}" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | head -n 1 || true)"
          fi
          if [[ -z "${SDKMGR}" || ! -x "${SDKMGR}" ]]; then
            echo "::error::找不到 sdkmanager，请检查 runner 的 Android SDK"
            exit 1
          fi
          echo "sdkmanager: ${SDKMGR}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$(dirname "${SDKMGR}")" >> "$GITHUB_PATH"
          yes | "${SDKMGR}" --licenses > /dev/null 2>&1 || true
          "${SDKMGR}" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          "${SDKMGR}" --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0' || true

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail
          # AGP 8.5.2 要求 Gradle 8.7+；仓库未提交 Gradle Wrapper，这里显式安装
          curl -sSfL https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.7-bin.zip"
          unzip -q -o "$RUNNER_TEMP/gradle-8.7-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build arm64-v8a release APK
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          GV_VERSION: ${{ inputs.geckoview_version || '120.0.20231113165053' }}
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace --continue \
            -PappVersionName="${VERSION}" \
            -PappVersionCode="${VERSION_CODE}" \
            -PgeckoviewVersion="${GV_VERSION}" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report build failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          {
            echo "Automated arm64-v8a build failed: ${RUN_URL}"
            echo
            echo '```text'
            tail -c 30000 "$LOG" 2>/dev/null || echo '(no build log captured)'
            echo
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'CI build failed in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/issue.md" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI build failed: run ${GITHUB_RUN_ID}" \
              --body-file "$RUNNER_TEMP/issue.md" || true
          fi

      - name: Sign APK
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release

          UNSIGNED=$(ls -1 app/build/outputs/apk/release/*-unsigned.apk 2>/dev/null | head -n 1 || true)
          if [[ -z "${UNSIGNED}" ]]; then
            UNSIGNED=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          fi
          if [[ -z "${UNSIGNED}" ]]; then
            echo "::error::未找到 assembleRelease 产出的 APK"
            exit 1
          fi
          echo "Unsigned APK: ${UNSIGNED}"

          BT_DIR=$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n 1)
          BT_DIR="${BT_DIR%/}"
          echo "build-tools: ${BT_DIR}"

          KS="$RUNNER_TEMP/release.jks"

          # Fixed signing, zero configuration: the keystore ships with this repository so every
          # build uses the same key and in-app upgrades install cleanly. Secrets are optional
          # overrides for anyone who later wants to rotate the key without changing the workflow.
          if [[ -n "${SIGNING_KEYSTORE_BASE64}" && -n "${SIGNING_KEYSTORE_PASSWORD}" ]]; then
            printf '%s' "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${KS}"
            KSPASS="${SIGNING_KEYSTORE_PASSWORD}"
            KEYPASS="${SIGNING_KEY_PASSWORD:-${KSPASS}}"
            ALIAS="${SIGNING_KEY_ALIAS:-ikelee}"
            SIGN_SOURCE="repository secret"
          else
            KS="signing/ikelee-release.jks"
            KSPASS="liyikui917"
            KEYPASS="liyikui917"
            ALIAS="ikelee"
            SIGN_SOURCE="in-repo keystore"
          fi
          if [[ ! -f "${KS}" ]]; then
            echo "::error::找不到签名 keystore：${KS}"
            exit 1
          fi
          if ! keytool -list -keystore "${KS}" -storepass "${KSPASS}" > /dev/null 2>&1; then
            echo "::error::无法用口令打开 keystore，请核对 signing/ikelee-release.jks 或 Secret"
            exit 1
          fi
          echo "Signing with ${SIGN_SOURCE} (alias ${ALIAS})"

          APK_NAME="GeckoDownloader-${VERSION}-arm64-v8a.apk"
          "${BT_DIR}/zipalign" -p -f 4 "${UNSIGNED}" "$RUNNER_TEMP/aligned.apk"
          "${BT_DIR}/apksigner" sign \
            --ks "${KS}" --ks-key-alias "${ALIAS}" \
            --ks-pass "pass:${KSPASS}" --key-pass "pass:${KEYPASS}" \
            --out "release/${APK_NAME}" "$RUNNER_TEMP/aligned.apk"
          "${BT_DIR}/apksigner" verify --verbose "release/${APK_NAME}"

          # Publish the signing certificate fingerprint so every release can be checked
          # against the previous one. Identical fingerprint = in-app upgrade will install.
          CERT_SHA256=$("${BT_DIR}/apksigner" verify --print-certs "release/${APK_NAME}" \
            | grep -m1 'SHA-256 digest:' | awk '{print $NF}' || true)
          echo "Signing cert SHA-256: ${CERT_SHA256:-unknown} (alias ${ALIAS})"

          (cd release && sha256sum ./*.apk > SHA256SUMS)
          echo "sign_mode=release" >> "$GITHUB_OUTPUT"
          echo "sign_alias=${ALIAS}" >> "$GITHUB_OUTPUT"
          echo "sign_source=${SIGN_SOURCE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify arm64-v8a only
        shell: bash
        env:
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        run: |
          set -euo pipefail
          python3 - "release/${APK_NAME}" <<'PY'
          import sys, zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              abis = {
                  name.split('/')[1]
                  for name in z.namelist()
                  if name.startswith('lib/') and name.count('/') >= 2
              }
          print('Packaged ABIs:', ', '.join(sorted(abis)) or '(no native libs)')
          extra = abis - {'arm64-v8a'}
          if extra:
              sys.exit('ERROR: APK 混入了非 arm64-v8a 架构: ' + ', '.join(sorted(extra)))
          print('OK: 仅 arm64-v8a (ARMv8-A 64-bit)')
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_MODE: ${{ steps.package.outputs.sign_mode }}
          SIGN_ALIAS: ${{ steps.package.outputs.sign_alias }}
          SIGN_SOURCE: ${{ steps.package.outputs.sign_source }}
          CERT_SHA256: ${{ steps.package.outputs.cert_sha256 }}
          ALREADY_PUBLISHED: ${{ steps.version.outputs.already_published }}
        run: |
          set -euo pipefail
          if [[ "${ALREADY_PUBLISHED}" == "true" ]]; then
            echo "Release ${VERSION} 已存在，跳过发布（构建与 ABI/签名校验本次仍已通过）。"
            gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
              --json url,assets --jq '"已有 Release: " + .url, (.assets[].name)'
            exit 0
          fi
          {
            echo "## GeckoDownloader ${VERSION}"
            echo
            echo "- 架构：仅 \`arm64-v8a\` (ARMv8-A 64-bit)，不含 armeabi-v7a / x86 / x86_64"
            echo "- 版本规则：\`YY.MM.N\`（年.月.当月序号），本次 \`${VERSION}\`"
            echo "- 构建：AGP 8.5.2 / Gradle 8.7 / JDK 17 / compileSdk 34 / R8"
            if [[ "${SIGN_MODE}" == "release" ]]; then
              echo "- 签名：固定签名（别名 \`${SIGN_ALIAS}\`，来源 ${SIGN_SOURCE}），与应用内更新共用同一密钥，可直接覆盖升级。"
              if [[ -n "${CERT_SHA256}" ]]; then
                echo "- 签名证书 SHA-256：\`${CERT_SHA256}\`（各版本一致才代表签名未变）"
              fi
            fi
            echo "- 校验：下载 \`GeckoDownloader-${VERSION}-arm64-v8a.apk\` 后对照 \`SHA256SUMS\`。"
          } > release_notes.md

          gh release create "${VERSION}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "GeckoDownloader ${VERSION} (arm64-v8a)" \
            --notes-file release_notes.md

          echo "Release ${VERSION} 已发布，附件："
          gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name'
